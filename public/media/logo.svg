<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Branches Lab Logo: Stylized Tree/Branch with "Rookie Birds" -->
  <rect width="200" height="200" fill="none"/>
  
  <!-- The "Branch" -->
  <path d="M100 160 L100 100 L60 60 M100 100 L140 60 M100 130 L130 110" 
        stroke="#3498db" stroke-width="10" stroke-linecap="round" fill="none"/>
  
  <!-- Rookie Bird 1 (on left branch) -->
  <g transform="translate(55, 50) rotate(-15)">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#f1c40f"/> <!-- Brighter Yellow -->
    <path d="M10 -2 L14 0 L10 2 Z" fill="#e67e22"/> <!-- Orange Beak -->
    <circle cx="4" cy="-2" r="1.5" fill="black"/> <!-- Eye -->
  </g>

  <!-- Rookie Bird 2 (on right branch) -->
  <g transform="translate(145, 55) rotate(10)">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#f1c40f"/>
    <path d="M-10 -2 L-14 0 L-10 2 Z" fill="#e67e22"/>
    <circle cx="-4" cy="-2" r="1.5" fill="black"/>
  </g>

  <!-- Rookie Bird 3 (on small branch) -->
  <g transform="translate(135, 105) rotate(5)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#f1c40f"/>
    <path d="M8 -1.5 L11 0 L8 1.5 Z" fill="#e67e22"/>
    <circle cx="3" cy="-1.5" r="1" fill="black"/>
  </g>
  
  <!-- Digital Nodes -->
  <circle cx="60" cy="60" r="4" fill="#3498db"/>
  <circle cx="140" cy="60" r="4" fill="#3498db"/>
  <circle cx="100" cy="160" r="5" fill="#3498db"/>
</svg>
